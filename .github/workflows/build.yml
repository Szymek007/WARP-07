name: Build .NET project

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


env:
  PROJECT_PATH: "WARP-07.DEMO"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm runner
        shell: bash
        run: echo "Runner is ready"

      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Show directory
        run: pwd
      
      
      - name: Debug repository
        shell: bash
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "All project files:"
          find . -type f \( -name "*.csproj" -o -name "*.sln" -o -name "*.slnx" \)

          echo "Project directory:"
          find . -type d -iname "*WARP*"


      - name: Show repository structure
        shell: bash
        run: |
          pwd
          ls -la
          find . -maxdepth 3 \( -name "*.csproj" -o -name "*.sln" -o -name "*.slnx" \)

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check repository structure
        shell: bash
        run: bash scripts/check-repository.sh "$PROJECT_PATH"

      - name: Restore dependencies
        shell: bash
        run: dotnet restore "$PROJECT_PATH"

      - name: Build project
        shell: bash
        run: dotnet build "$PROJECT_PATH" --configuration Release --no-restore

      - name: Run project
        shell: bash
        run: dotnet run --project "$PROJECT_PATH" --configuration Release --no-build
