name: Build .NET project

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm runner
        shell: bash
        run: echo "Runner is ready"

      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Show directory
        run: pwd

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        shell: bash
        run: dotnet restore "WARP-07.DEMO"

      - name: Build project
        shell: bash
        run: dotnet build "WARP-07.DEMO" --configuration Release --no-restore

      - name: Run project
        shell: bash
        run: dotnet run --project "WARP-07.DEMO" --configuration Release --no-build
        